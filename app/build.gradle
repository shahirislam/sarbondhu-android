plugins {
    id 'com.android.application'
}

// Release signing key lives outside the repo; point SARBONDHU_KEYSTORE_PROPS at its properties file.
def keystorePropsFile = file(System.getenv('SARBONDHU_KEYSTORE_PROPS') ?: '../../sarbondhu-keystore/keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace = 'com.sarbondhu.app'
    compileSdk = 35

    defaultConfig {
        applicationId = 'com.sarbondhu.app'
        minSdk = 24
        targetSdk = 35
        versionCode = 1
        versionName = '1.0'
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile = file(keystoreProps['storeFile'])
                storePassword = keystoreProps['storePassword']
                keyAlias = keystoreProps['keyAlias']
                keyPassword = keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            if (keystorePropsFile.exists()) {
                signingConfig = signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.9.4'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'com.airbnb.android:lottie:6.6.10'

    testImplementation 'junit:junit:4.13.2'
}
